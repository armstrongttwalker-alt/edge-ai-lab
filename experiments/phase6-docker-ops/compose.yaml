services:
  # Open WebUI - 浏览器访问本地模型
  # 镜像: ghcr.m.daocloud.io/open-webui/open-webui:main
  open-webui:
    image: ghcr.m.daocloud.io/open-webui/open-webui:main
    container_name: edge-ai-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - ./open-webui/data:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://host.docker.internal:8000/v1
      - OPENAI_API_KEY=edge-ai-lab
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Qdrant 向量数据库
  # 镜像: docker.m.daocloud.io/qdrant/qdrant:latest
  qdrant:
    image: docker.m.daocloud.io/qdrant/qdrant:latest
    container_name: edge-ai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant/storage:/qdrant/storage

  # Prometheus 监控
  # 镜像: docker.m.daocloud.io/prom/prometheus:latest
  prometheus:
    image: docker.m.daocloud.io/prom/prometheus:latest
    container_name: edge-ai-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # Grafana 可视化
  # 镜像: docker.m.daocloud.io/grafana/grafana:latest
  grafana:
    image: docker.m.daocloud.io/grafana/grafana:latest
    container_name: edge-ai-grafana
    restart: unless-stopped
    ports:
      - "3100:3000"
    volumes:
      - ./monitoring/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=edgeai
      - GF_USERS_ALLOW_SIGN_UP=false
